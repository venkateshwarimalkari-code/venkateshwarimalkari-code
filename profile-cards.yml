name: Refresh profile cards

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - render_cards.py
      - scripts/**
      - fonts/**
      - assets/**
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fonttools pillow

      - name: Fetch contribution data
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) to include
          # private contributions; otherwise the built-in token covers public ones.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_github_data.py

      - name: Render cards
        run: python render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json cards README.md
          if git diff --cached --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
